name: Assemble and validate 2.9.4 release candidate
on:
  push:
    paths:
      - '.github/workflows/assemble-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated testing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble complete Lumiverse extension
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/marcusjeanr-ctrl/Companion.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --quiet b21f2230fdb9364d98e3467cd80dfeefc001dc09
          git fetch --quiet origin rc-2.9.4-staging:refs/remotes/origin/rc-2.9.4-staging

          rsync -a --exclude='.git' --exclude='.github' "$RUNNER_TEMP/upstream/" "$GITHUB_WORKSPACE/"
          git archive origin/rc-2.9.4-staging -- \
            README.md spindle.json dist/backend.js tools/run_tests.cjs \
            tools/test_save_continue_boundary.cjs tools/test_universal_card_matrix.cjs \
            tools/SOURCE_COMPARISON_2_9_4.json tools/CARD_SPECS_2_9_4.json \
            tools/CONSOLIDATION_2_9_4.md | tar -x

          test "$(git hash-object dist/backend.js)" = acdb500047c201f8d1af1169292f0c43d9d7e16a
          test "$(git hash-object spindle.json)" = 822719cb26dec04491940b83ad0dc7de1abfdcf6
          test "$(git hash-object dist/frontend.js)" = 456ac0cf3ee793031a43cd58498dbd600e195628
          test "$(git hash-object tools/run_tests.cjs)" = 548fa88b4bd52bab1205208e7e62455c37a451fc

          node -e "const m=require('./spindle.json'); if(m.version!=='2.9.4'||m.identifier!=='rpg_companion_hms'||m.github!=='https://github.com/marcusjeanr-ctrl/COMPANION-TESTING'||m.entry_backend!=='dist/backend.js'||m.entry_frontend!=='dist/frontend.js')process.exit(1)"

      - name: Verify all baseline and compatibility suites
        run: node tools/run_tests.cjs

      - name: Publish validated source to COMPANION-TESTING main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish verified RPG Companion 2.9.4 release candidate [skip ci]"
          git push origin HEAD:main
