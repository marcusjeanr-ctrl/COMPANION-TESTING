name: Validate Companion candidate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release identity and entrypoints
        run: node tools/check_release.cjs
      - name: Run existing regression suites
        run: node tools/run_tests.cjs
      - name: Verify installable candidate package
        run: python3 tools/package_rc.py "$RUNNER_TEMP/companion-rc.zip"
      - name: Verify tests did not modify tracked files
        run: git diff --exit-code

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install --timeout 30 --retries 2 playwright==1.62.0
          companion_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$companion_browser" ]; then
            "$companion_browser" --version
            printf 'CHROMIUM_PATH=%s\n' "$companion_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            python - <<'PYTHON'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_PATH=' + p.chromium.executable_path + '\n')
          PYTHON
          fi
      - name: Exercise real browser layout with a mock host
        run: |
          python tools/test_ui_browser.py
          python tools/test_visibility_browser.py
