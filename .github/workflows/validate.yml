name: Validate Companion candidate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release identity, syntax, regressions and smoke test
        run: node tools/run_tests.cjs
      - name: Verify installable candidate package
        run: python3 tools/package_rc.py "$RUNNER_TEMP/companion-rc.zip"
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
